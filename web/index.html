<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Shield</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: hero with animated voice waveform, then two large analysis panels (record / file); each shows the audio waveform coloured by AI score, a big gauge and the verdict */
:root{
  --bg:#0d0e10; --panel:#15161a; --raised:#1d1f23; --line:#2a2c31; --ink:#ece8e0; --muted:#8e9095;
  --sand:#c9b68e; --sand-2:#e0cfa8; --sand-ink:#16130d;
  --ai:#d08b6c; --human:#94ab8c; --unsure:#a6a8ad;
  --f-sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--f-sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1400px 600px at 50% -260px,#221f19 0%,var(--bg) 62%) fixed,var(--bg)}
.wrap{max-width:1320px;margin:0 auto;padding:28px 28px 48px;display:flex;flex-direction:column;gap:30px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:46px;height:46px;border-radius:12px;background:var(--raised);border:1px solid var(--line);display:grid;place-items:center}
.logo svg{width:26px;height:26px}
.brand b{display:block;font-weight:700;font-size:22px;letter-spacing:.01em}
.brand small{display:block;font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.right{display:flex;align-items:center;gap:12px}
.chip{display:flex;align-items:center;gap:9px;height:36px;padding:0 14px;border:1px solid var(--line);border-radius:999px;font-family:var(--f-mono);font-size:13px;color:var(--muted);background:var(--panel)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--human);box-shadow:0 0 0 4px rgba(148,171,140,.15)}.dot.err{background:var(--ai)}
.seg{display:flex;height:36px;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{all:unset;cursor:pointer;padding:0 14px;font-size:13px;color:var(--muted);display:grid;place-items:center}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink)}

/* hero */
.hero{position:relative;border:1px solid var(--line);border-radius:18px;background:var(--panel);overflow:hidden;padding:30px 34px;display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:150px}
.hero h1{margin:0;font-size:clamp(28px,3.4vw,42px);font-weight:700;line-height:1.1;letter-spacing:-.01em;text-wrap:balance;position:relative;z-index:1}
.hero h1 span{color:var(--sand)}
.hero p{margin:8px 0 0;color:var(--muted);font-size:16px;position:relative;z-index:1}
.hero canvas{position:absolute;right:0;top:0;width:58%;height:100%;opacity:.9}
.legend{display:flex;gap:18px;margin-top:16px;font-family:var(--f-mono);font-size:12px;color:var(--muted);position:relative;z-index:1}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}

/* panels */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
@media (max-width:900px){.grid{grid-template-columns:1fr}.hero canvas{width:100%;opacity:.25}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:22px;min-width:0;box-shadow:0 30px 60px -40px rgba(0,0,0,.9)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ph h2{margin:0;display:flex;align-items:center;gap:12px;font-size:20px;font-weight:600}
.ph h2 .ic{width:38px;height:38px;border-radius:10px;background:var(--raised);display:grid;place-items:center}
.ph h2 svg{width:20px;height:20px;fill:var(--sand)}
.tag{font-family:var(--f-mono);font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.rec-dot{width:9px;height:9px;border-radius:50%;background:var(--ai);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}

/* stage: big mic / drop + waveform */
.stage{position:relative;border-radius:14px;background:var(--bg);border:1px solid var(--line);height:200px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.mic{all:unset;cursor:pointer;position:relative;z-index:2;width:104px;height:104px;border-radius:50%;background:var(--sand);display:grid;place-items:center;box-shadow:0 10px 30px -10px rgba(201,182,142,.55);transition:transform .15s,background .2s}
.mic:hover{transform:scale(1.04);background:var(--sand-2)}
.mic svg{width:40px;height:40px;fill:var(--sand-ink)}
.mic.on{background:var(--ai);box-shadow:0 0 0 0 rgba(208,139,108,.5);animation:ring 1.6s infinite}
.mic.on svg{fill:#1a0f0a}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(208,139,108,.45)}100%{box-shadow:0 0 0 34px rgba(208,139,108,0)}}
.mic:disabled{opacity:.35;cursor:default;animation:none}
.mic.small{width:64px;height:64px;position:absolute;left:18px;top:18px}
.mic.small svg{width:26px;height:26px}
.hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-family:var(--f-mono);font-size:12px;color:var(--muted);z-index:2;pointer-events:none}
.drop{cursor:pointer}
.drop input{display:none}
.drop .up{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted);text-align:center;padding:0 20px}
.drop .up .circ{width:84px;height:84px;border-radius:50%;border:1px dashed #44464d;display:grid;place-items:center;transition:border-color .2s}
.drop .up svg{width:34px;height:34px;fill:var(--sand)}
.drop:hover .circ,.drop.over .circ{border-color:var(--sand)}
.drop .fname{position:absolute;z-index:2;left:16px;top:14px;right:16px;font-family:var(--f-mono);font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* buttons */
.controls{display:flex;flex-wrap:wrap;gap:12px}
.btn{all:unset;cursor:pointer;height:50px;padding:0 24px;border-radius:12px;display:inline-flex;align-items:center;gap:10px;font-size:16px;font-weight:600;border:1px solid var(--line);background:var(--raised);color:var(--ink);transition:background .2s,border-color .2s,opacity .2s}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn:hover{border-color:#41444b}
.btn.primary{background:var(--sand);border-color:var(--sand);color:var(--sand-ink)}
.btn.primary:hover{background:var(--sand-2)}
.btn.grow{flex:1;justify-content:center}
.btn:disabled{opacity:.35;cursor:default;pointer-events:none}
.btn:focus-visible,.mic:focus-visible,.drop:focus-visible,.seg button:focus-visible{outline:2px solid var(--sand);outline-offset:3px}
audio{width:100%;height:40px;color-scheme:dark}

/* result */
.result{display:grid;grid-template-columns:180px minmax(0,1fr);gap:26px;align-items:center;padding:22px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
@media (max-width:480px){.result{grid-template-columns:1fr;justify-items:center}}
.gauge{position:relative;width:180px;height:180px}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .trk{stroke:var(--line)}
.gauge .val{stroke:var(--unsure);transition:stroke-dashoffset .6s ease,stroke .3s}
.gauge .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .n{font-family:var(--f-mono);font-size:48px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.gauge .n small{font-size:20px;color:var(--muted)}
.gauge .u{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--muted);margin-top:6px}
.info{display:flex;flex-direction:column;gap:12px;min-width:0}
.verdict{font-size:26px;font-weight:700;line-height:1.15;color:var(--muted)}
.msg{font-size:15px;color:#bdbab3;min-height:22px}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:500}
.ai .val{stroke:var(--ai)}.ai .n,.ai .verdict{color:var(--ai)}
.human .val{stroke:var(--human)}.human .n,.human .verdict{color:var(--human)}
.unsure .verdict{color:var(--ink)}
.err{color:var(--ai)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24"><rect x="2" y="10" width="2.2" height="4" rx="1.1" fill="#c9b68e"/><rect x="6" y="6" width="2.2" height="12" rx="1.1" fill="#c9b68e"/><rect x="10" y="3" width="2.2" height="18" rx="1.1" fill="#e0cfa8"/><rect x="14" y="7" width="2.2" height="10" rx="1.1" fill="#c9b68e"/><rect x="18" y="9.5" width="2.2" height="5" rx="1.1" fill="#c9b68e"/></svg></div>
      <div><b>Voice Shield</b><small>AI voice-clone detector</small></div>
    </div>
    <div class="right">
      <div class="chip"><i class="dot" id="dot"></i><span id="status">connecting</span></div>
      <div class="seg" role="group" aria-label="Language">
        <button id="lang-en" aria-pressed="true">EN</button>
        <button id="lang-hi" aria-pressed="false">हिं</button>
      </div>
    </div>
  </div>

  <section class="hero">
    <div>
      <h1>Is this voice <span>human</span> or <span>AI</span>?</h1>
      <p>Hindi · English · Hinglish</p>
      <div class="legend"><span><i style="background:var(--human)"></i>Human</span><span><i style="background:var(--unsure)"></i>Uncertain</span><span><i style="background:var(--ai)"></i>AI-generated</span></div>
    </div>
    <canvas id="hero-wave"></canvas>
  </section>

  <div class="grid">
    <!-- record -->
    <section class="panel">
      <div class="ph">
        <h2><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg></span>Record a voice</h2>
        <span class="tag" id="rec-tag"></span>
      </div>
      <div class="stage" id="rec-stage">
        <canvas id="rec-wave"></canvas>
        <button class="mic" id="rec-btn" disabled aria-label="Start recording">
          <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
        </button>
        <div class="hint" id="rec-hint"></div>
      </div>
      <audio id="rec-audio" controls hidden></audio>
      <div class="controls">
        <button class="btn primary grow" id="rec-process" disabled><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Start processing</button>
        <button class="btn" id="rec-reset">Reset</button>
      </div>
      <div class="result" id="rec">
        <div class="gauge"><svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="52" fill="none" stroke-width="9"/><circle class="val" cx="60" cy="60" r="52" fill="none" stroke-width="9" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg>
          <div class="c"><span class="n">—</span><span class="u">AI SCORE</span></div></div>
        <div class="info"><div class="verdict"></div><div class="msg"></div><div class="meta"></div></div>
      </div>
    </section>

    <!-- file -->
    <section class="panel">
      <div class="ph">
        <h2><span class="ic"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6Zm-1 7V3.5L18.5 9H13Zm-3 9a2 2 0 1 1 0-4c.37 0 .7.1 1 .27V10h4v2h-2v4a2 2 0 0 1-3 2Z"/></svg></span>Analyze an audio file</h2>
        <span class="tag" id="file-tag"></span>
      </div>
      <label class="stage drop" id="drop" tabindex="0">
        <input type="file" id="file" accept="audio/*">
        <canvas id="file-wave"></canvas>
        <span class="fname" id="fname" hidden></span>
        <span class="up" id="up-empty"><span class="circ"><svg viewBox="0 0 24 24"><path d="M11 16V7.83l-3.59 3.58L6 10l6-6 6 6-1.41 1.41L13 7.83V16h-2Zm-7 2h16v2H4v-2Z"/></svg></span><span>Drop audio or click to choose</span></span>
      </label>
      <div class="controls">
        <button class="btn primary grow" id="file-process" disabled><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Start processing</button>
        <button class="btn" id="file-reset">Clear</button>
      </div>
      <div class="result" id="up">
        <div class="gauge"><svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="52" fill="none" stroke-width="9"/><circle class="val" cx="60" cy="60" r="52" fill="none" stroke-width="9" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg>
          <div class="c"><span class="n">—</span><span class="u">AI SCORE</span></div></div>
        <div class="info"><div class="verdict"></div><div class="msg"></div><div class="meta"></div></div>
      </div>
    </section>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let lang = "en", ready = false, last = {};
const LABEL = {fake:{en:"AI-generated voice",hi:"AI द्वारा बनी आवाज़"}, real:{en:"Human voice",hi:"इंसानी आवाज़"}, unsure:{en:"Uncertain",hi:"अनिश्चित"}};
const STATE = {idle:{en:"Waiting for audio",hi:"ऑडियो का इंतज़ार"}, recording:{en:"Recording…",hi:"रिकॉर्ड हो रहा है…"}, ready:{en:"Ready to process",hi:"जाँच के लिए तैयार"}, processing:{en:"Analyzing voice…",hi:"आवाज़ की जाँच…"}};
const HINT = {rec:{en:"Tap to record · tap again to stop",hi:"रिकॉर्ड करने के लिए दबाएँ"}};
const CLS = {fake:"ai", real:"human", unsure:"unsure"};
const C = 326.7;
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const colorFor = (p) => p >= .7 ? css("--ai") : p <= .3 ? css("--human") : css("--unsure");

// ---------- status
async function poll(){
  try{
    const s = await (await fetch("/api/status")).json();
    if (s.error){ $("dot").className = "dot err"; $("status").textContent = "model error"; return; }
    if (s.ready){ ready = true; $("dot").className = "dot ok"; $("status").textContent = (s.model || "ready").replace(".pth", "") + " · " + s.device;
      $("rec-btn").disabled = false; $("rec-process").disabled = !rec.blob; $("file-process").disabled = !file.blob; return; }
    $("status").textContent = "loading model";
  }catch{ $("dot").className = "dot err"; $("status").textContent = "server offline"; }
  setTimeout(poll, 1500);
}

// ---------- language
function setLang(l){
  lang = l;
  $("lang-en").setAttribute("aria-pressed", l === "en"); $("lang-hi").setAttribute("aria-pressed", l === "hi");
  $("rec-hint").textContent = rec.blob || recording ? "" : HINT.rec[lang];
  for (const k of ["rec", "up"]) last[k] ? show(k, last[k]) : setState(k, $(k).dataset.state || "idle");
}
$("lang-en").onclick = () => setLang("en");
$("lang-hi").onclick = () => setLang("hi");

// ---------- result card
function setState(which, state, msg){
  delete last[which];
  const el = $(which); el.dataset.state = state; el.className = "result";
  el.querySelector(".n").textContent = "—"; el.querySelector(".val").style.strokeDashoffset = C;
  el.querySelector(".verdict").textContent = STATE[state][lang];
  el.querySelector(".msg").innerHTML = msg || ""; el.querySelector(".meta").textContent = "";
}
function show(which, v){
  last[which] = v;
  const el = $(which), lab = v.deepfake.label, p = v.deepfake.score;
  el.className = "result " + CLS[lab];
  el.querySelector(".n").innerHTML = `${Math.round(p * 100)}<small>%</small>`;
  el.querySelector(".val").style.strokeDashoffset = C * (1 - p);
  el.querySelector(".verdict").textContent = LABEL[lab][lang];
  el.querySelector(".msg").textContent = lang === "en" ? v.message_en : v.message_hi;
  const m = [`audio <b>${v.speech_seconds.toFixed(1)} s</b>`, `windows <b>${(v.timeline || []).length}</b>`];
  if (v.took) m.push(`time <b>${v.took} s</b>`);
  el.querySelector(".meta").innerHTML = m.map(s => `<span>${s}</span>`).join("");
}

// ---------- waveform drawing
function fit(c){ const r = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight; c.width = w * r; c.height = h * r; const g = c.getContext("2d"); g.scale(r, r); return [g, w, h]; }
function peaks(samples, bars){
  const out = new Float32Array(bars), step = Math.max(1, Math.floor(samples.length / bars));
  let mx = 1e-6;
  for (let b = 0; b < bars; b++){ let s = 0; const o = b * step; for (let i = 0; i < step && o + i < samples.length; i++) s = Math.max(s, Math.abs(samples[o + i])); out[b] = s; mx = Math.max(mx, s); }
  for (let b = 0; b < bars; b++) out[b] /= mx;
  return out;
}
// timeline = [{t, p_fake}] from the server: colour each bar by the score of the 4 s window covering it
function drawWave(c, samples, timeline, seconds){
  const [g, w, h] = fit(c); g.clearRect(0, 0, w, h);
  if (!samples) return;
  const gap = 3, bw = 3, bars = Math.floor((w - 24) / (bw + gap)), pk = peaks(samples, bars);
  for (let b = 0; b < bars; b++){
    const t = (b / bars) * seconds; let col = "#4a4c52";
    if (timeline && timeline.length){
      const cover = timeline.filter(x => t >= x.t && t < x.t + 4.04);
      const p = cover.length ? cover.reduce((a, x) => a + x.p_fake, 0) / cover.length : timeline[timeline.length - 1].p_fake;
      col = colorFor(p);
    }
    const bh = Math.max(3, pk[b] * (h * 0.62));
    g.fillStyle = col; g.beginPath(); g.roundRect(12 + b * (bw + gap), (h - bh) / 2, bw, bh, 1.5); g.fill();
  }
}
// live level bars while recording
function drawLive(c, analyser, buf){
  const [g, w, h] = fit(c); g.clearRect(0, 0, w, h);
  analyser.getFloatTimeDomainData(buf);
  liveHist.push(Math.min(1, Math.sqrt(buf.reduce((a, v) => a + v * v, 0) / buf.length) * 6));
  const gap = 3, bw = 3, bars = Math.floor((w - 24) / (bw + gap));
  while (liveHist.length > bars) liveHist.shift();
  liveHist.forEach((v, i) => { const bh = Math.max(3, v * h * 0.62); g.fillStyle = css("--ai"); g.globalAlpha = .35 + .65 * (i / bars); g.beginPath(); g.roundRect(12 + i * (bw + gap), (h - bh) / 2, bw, bh, 1.5); g.fill(); });
  g.globalAlpha = 1;
}
// decorative hero wave
const hero = $("hero-wave"); let heroT = 0;
function heroFrame(){
  const [g, w, h] = fit(hero); g.clearRect(0, 0, w, h);
  const bars = Math.floor(w / 7);
  for (let i = 0; i < bars; i++){
    const x = i / bars, env = Math.sin(Math.PI * x);
    const v = env * (0.35 + 0.65 * Math.abs(Math.sin(i * 0.37 + heroT) * Math.cos(i * 0.11 - heroT * 0.7)));
    const bh = Math.max(3, v * h * 0.7);
    g.fillStyle = x < .4 ? css("--human") : x < .6 ? css("--unsure") : css("--ai"); g.globalAlpha = .25 + .55 * env;
    g.beginPath(); g.roundRect(i * 7, (h - bh) / 2, 3, bh, 1.5); g.fill();
  }
  g.globalAlpha = 1; heroT += 0.02;
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) requestAnimationFrame(heroFrame);
}

// ---------- scoring
async function score(which, blob, name, btn){
  if (!ready || !blob) return;
  btn.disabled = true; setState(which, "processing");
  const fd = new FormData(); fd.append("file", blob, name); fd.append("phone", "false");
  const t = performance.now();
  try{
    const r = await fetch("/api/score", {method: "POST", body: fd});
    const v = await r.json();
    if (!r.ok) throw new Error(v.error || "Processing failed");
    v.took = ((performance.now() - t) / 1000).toFixed(1);
    show(which, v);
    const st = which === "rec" ? rec : file;
    drawWave($(which === "rec" ? "rec-wave" : "file-wave"), st.samples, v.timeline, st.seconds);
  }catch(e){ setState(which, "ready", `<span class="err">${e.message}</span>`); }
  btn.disabled = false;
}
async function decode(blob){
  try{
    const ctx = new AudioContext(); const ab = await ctx.decodeAudioData(await blob.arrayBuffer()); ctx.close();
    return {samples: ab.getChannelData(0), seconds: ab.duration};
  }catch{ return {samples: null, seconds: 0}; }
}

// ---------- record
const WORKLET = `class Tap extends AudioWorkletProcessor{process(i){const c=i[0][0];if(c)this.port.postMessage(c.slice(0));return true}}registerProcessor("tap",Tap)`;
const MAX_REC_S = 15;
const rec = {blob: null, samples: null, seconds: 0};
let recording = null, liveHist = [], raf = null, tick = null;
function wavBlob(s, rate){
  const buf = new ArrayBuffer(44 + s.length * 2), v = new DataView(buf);
  const w = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + s.length * 2, true); w(8, "WAVE"); w(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, s.length * 2, true);
  for (let i = 0; i < s.length; i++) v.setInt16(44 + i * 2, Math.max(-32768, Math.min(32767, Math.round(s[i] * 32767))), true);
  return new Blob([buf], {type: "audio/wav"});
}
async function startRec(){
  const rate = 16000;
  const media = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1}});
  const ctx = new AudioContext({sampleRate: rate});
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], {type: "application/javascript"})));
  const src = ctx.createMediaStreamSource(media), tap = new AudioWorkletNode(ctx, "tap"), analyser = ctx.createAnalyser();
  analyser.fftSize = 1024; src.connect(tap); src.connect(analyser);
  const chunks = []; let n = 0;
  tap.port.onmessage = (e) => { chunks.push(e.data); n += e.data.length; if (n >= MAX_REC_S * rate) stopRec(); };
  recording = {media, ctx, chunks, rate, count: () => n};
  rec.blob = null; $("rec-audio").hidden = true; $("rec-process").disabled = true; $("rec-hint").textContent = "";
  liveHist = []; const buf = new Float32Array(analyser.fftSize);
  const loop = () => { drawLive($("rec-wave"), analyser, buf); raf = requestAnimationFrame(loop); }; loop();
  const t0 = performance.now();
  const tg = () => { $("rec-tag").innerHTML = `<i class="rec-dot"></i>${((performance.now() - t0) / 1000).toFixed(0)} s / ${MAX_REC_S} s`; };
  tg(); tick = setInterval(tg, 250);
  $("rec-btn").classList.add("on", "small"); $("rec-btn").setAttribute("aria-label", "Stop recording");
  setState("rec", "recording");
}
function stopRec(){
  const r = recording; if (!r) return; recording = null;
  cancelAnimationFrame(raf); clearInterval(tick);
  r.media.getTracks().forEach(t => t.stop()); r.ctx.close();
  $("rec-btn").classList.remove("on"); $("rec-btn").setAttribute("aria-label", "Record again");
  const total = r.count(), all = new Float32Array(total); let o = 0;
  for (const c of r.chunks){ all.set(c, o); o += c.length; }
  $("rec-tag").textContent = (total / r.rate).toFixed(1) + " s";
  if (total < r.rate){ $("rec-btn").classList.remove("small"); drawWave($("rec-wave"), null); setState("rec", "idle", `<span class="err">${lang === "en" ? "Too short. Record at least 2 seconds." : "बहुत छोटा। कम से कम 2 सेकंड रिकॉर्ड करें।"}</span>`); return; }
  rec.blob = wavBlob(all, r.rate); rec.samples = all; rec.seconds = total / r.rate;
  $("rec-audio").src = URL.createObjectURL(rec.blob); $("rec-audio").hidden = false;
  drawWave($("rec-wave"), rec.samples, null, rec.seconds);
  $("rec-process").disabled = !ready; setState("rec", "ready");
}
$("rec-btn").onclick = async () => {
  if (recording) return stopRec();
  try{ await startRec(); }catch(e){ setState("rec", "idle", `<span class="err">Microphone: ${e.message}</span>`); }
};
$("rec-process").onclick = () => score("rec", rec.blob, "recording.wav", $("rec-process"));
$("rec-reset").onclick = () => {
  if (recording) stopRec();
  rec.blob = null; rec.samples = null; $("rec-audio").hidden = true; $("rec-audio").removeAttribute("src");
  $("rec-btn").classList.remove("small", "on"); $("rec-tag").textContent = ""; $("rec-hint").textContent = HINT.rec[lang];
  drawWave($("rec-wave"), null); $("rec-process").disabled = true; setState("rec", "idle");
};

// ---------- file
const file = {blob: null, samples: null, seconds: 0};
async function choose(f){
  file.blob = f; $("fname").textContent = f.name; $("fname").hidden = false; $("up-empty").hidden = true;
  const d = await decode(f); file.samples = d.samples; file.seconds = d.seconds;
  $("file-tag").textContent = d.seconds ? d.seconds.toFixed(1) + " s" : (f.size / 1048576).toFixed(2) + " MB";
  drawWave($("file-wave"), file.samples, null, file.seconds);
  $("file-process").disabled = !ready; setState("up", "ready");
}
$("file").onchange = () => { const f = $("file").files[0]; if (f) choose(f); };
$("file-process").onclick = () => score("up", file.blob, file.blob ? file.blob.name : "clip", $("file-process"));
$("file-reset").onclick = () => {
  file.blob = null; file.samples = null; $("file").value = ""; $("fname").hidden = true; $("up-empty").hidden = false;
  $("file-tag").textContent = ""; drawWave($("file-wave"), null); $("file-process").disabled = true; setState("up", "idle");
};
const drop = $("drop");
drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") $("file").click(); });
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => { const f = e.dataTransfer.files[0]; if (f) choose(f); });

window.addEventListener("resize", () => {
  drawWave($("rec-wave"), rec.samples, last.rec && last.rec.timeline, rec.seconds);
  drawWave($("file-wave"), file.samples, last.up && last.up.timeline, file.seconds);
});
setState("rec", "idle"); setState("up", "idle"); $("rec-hint").textContent = HINT.rec[lang];
heroFrame(); poll();
</script>
